# .github/workflows/test.yml
#
# Questo workflow esegue la test suite (unit + integration) ad ogni push o pull request.
# I test e2e sono esclusi di default (vedi pytest.ini addopts).
#
# Per disabilitare temporaneamente: Settings → Actions → Disable workflow.

name: Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Forza Node.js 24 per le GitHub Actions (rimuove il deprecation warning)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      # Variabili d'ambiente mock per evitare errori di import durante la raccolta dei test.
      # I test usano mock/fixture, non chiamate reali alle API.
      TELEGRAM_TOKEN: mock_token
      GEMINI_API_KEY: mock_key
      NOTION_CLIENT_ID: mock_id
      NOTION_CLIENT_SECRET: mock_secret
      NOTION_REDIRECT_URI: http://localhost/callback
      SECRET_KEY: mock_secret_key
      FLASK_SECRET_KEY: mock_flask_secret_key_for_testing
      DATABASE_URL: "sqlite:///:memory:"
      FLASK_ENV: testing

    steps:
    - name: Checkout del codice
      uses: actions/checkout@v4

    - name: Setup Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Installazione dipendenze
      run: |
        python -m pip install --upgrade pip
        python -m pip install --require-hashes -r requirements-dev.lock

    - name: Scansione CVE dipendenze (pip-audit)
      run: |
        pip-audit -r requirements.lock --strict --desc

    - name: Esecuzione Test Suite (unit + integration, MOCK mode)
      run: |
        # addopts in pytest.ini esclude già gli e2e e applica --strict-markers.
        # Niente --cov qui: la coverage viene raccolta nello step successivo separato
        # per evitare che pytest-cov importi tutti i moduli src/ (inclusi quelli con
        # dipendenze pesanti: matplotlib, seaborn, google-genai, telegram).
        python -m pytest -v --tb=short

    - name: Coverage (moduli testabili, senza dipendenze grafiche/SDK heavy)
      run: |
        python -m pytest --cov=src --cov-report=term-missing

    - name: Upload della coverage (Opzionale)
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false

  frontend:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout del codice
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Installazione dipendenze frontend
      working-directory: frontend
      run: npm ci

    - name: Test frontend
      working-directory: frontend
      run: npm test

    - name: Lint frontend
      working-directory: frontend
      run: npm run lint

    - name: Typecheck frontend
      working-directory: frontend
      run: npm run typecheck

    - name: Production build
      working-directory: frontend
      run: npm run build
