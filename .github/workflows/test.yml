# .github/workflows/test.yml
# 
# Questo workflow esegue la "Mega Test Suite" in automatico ad ogni push o pull request.
# 
# 🚩 COME DISATTIVARE/ATTIVARE IL WORKFLOW:
# Se vuoi disabilitare temporaneamente il test automatico su GitHub:
# 1. Commenta le righe sotto 'on:' (push e pull_request).
# 2. Oppure vai nelle impostazioni del repository (Settings -> Actions) e disabilita i workflow.

name: Mega Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # Consente di avviare il test manualmente dalla tab "Actions" di GitHub
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout del codice
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Installazione dipendenze
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-mock pytest-flask pytest-cov
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Esecuzione Test Suite (MOCK mode)
      run: |
        # Eseguiamo i test in modalità MOCK (senza chiamare AI vere) per risparmiare crediti/token
        # Se volessi testare con l'AI vera in CI, dovresti aggiungere i Secrets nel repository
        # e passare il flag --real-ai
        python -m pytest tests/ -v --cov=src --cov-report=xml

    - name: Upload della coverage (Opzionale)
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false
