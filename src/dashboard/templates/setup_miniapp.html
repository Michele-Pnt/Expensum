<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Moneo Setup</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #f5f7fa);
            --text: var(--tg-theme-text-color, #111111);
            --hint: var(--tg-theme-hint-color, #666666);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #ffffff);
            --accent: #008080;
            --accent-dim: rgba(0, 128, 128, 0.15);
            --danger: #ef4444;
            --radius: 16px;
            --border: rgba(128, 128, 128, 0.2);
            --surface: rgba(128, 128, 128, 0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            /* Safe area per iPhone con notch/Dynamic Island */
            padding-bottom: calc(80px + env(safe-area-inset-bottom));
        }

        .header {
            padding: calc(16px + env(safe-area-inset-top)) 20px 14px;
            text-align: center;
            background: var(--secondary-bg);
            border-bottom: 1px solid var(--surface);
        }
        .header h1 { font-size: 22px; color: var(--accent); margin-bottom: 6px; }
        .header p { font-size: 14px; color: var(--hint); line-height: 1.5; max-width: 380px; margin: 0 auto; }

        .tabs {
            display: flex;
            background: var(--secondary-bg);
            border-bottom: 2px solid var(--surface);
        }

        .tab-btn {
            flex: 1;
            padding: 15px 8px;
            background: transparent;
            border: none;
            color: var(--hint);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all 0.25s;
            -webkit-tap-highlight-color: transparent;
        }
        .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

        .panel { display: none; padding: 20px 16px; }
        .panel.active { display: block; }

        .card {
            background: var(--secondary-bg);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 14px;
            border: 1px solid var(--surface);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }
        .card-title { font-weight: 700; font-size: 15px; color: var(--accent); }
        .btn-remove {
            color: var(--danger);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            background: rgba(239,68,68,0.1);
            border: none;
        }

        .field { margin-bottom: 12px; }
        .field label {
            display: block;
            font-size: 12px;
            color: var(--hint);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }
        .field input,
        .field select {
            width: 100%;
            padding: 14px 15px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 16px; /* >= 16px evita zoom automatico su iOS */
            -webkit-appearance: none;
        }
        .field input:focus, .field select:focus { border-color: var(--accent); outline: none; }
        .field select option { background: var(--secondary-bg); }

        .btn-add {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 16px;
            background: var(--accent-dim);
            border: 2px dashed var(--accent);
            border-radius: var(--radius);
            color: var(--accent);
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 18px;
            -webkit-tap-highlight-color: transparent;
            min-height: 52px;
        }

        .cat-section-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--hint);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin: 16px 0 10px;
        }

        .cat-search {
            width: 100%;
            padding: 11px 13px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 15px;
            margin-bottom: 12px;
        }
        .cat-search:focus { border-color: var(--accent); outline: none; }

        .preset-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
            max-height: 280px;
            overflow-y: auto;
            padding: 4px 2px;
        }
        .preset-chip {
            padding: 9px 15px;
            border-radius: 22px;
            background: var(--border);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 14px;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            min-height: 38px;
        }
        .preset-chip.selected {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
            font-weight: 600;
        }

        .cat-add-manual { display: flex; gap: 8px; margin-bottom: 16px; }
        .cat-add-manual input {
            flex: 1;
            padding: 11px 13px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 15px;
        }
        .cat-add-manual input:focus { border-color: var(--accent); outline: none; }
        .cat-manual-btn {
            padding: 11px 16px;
            background: var(--accent);
            border: none;
            border-radius: 10px;
            color: #000;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
        }

        .added-categories-title { font-size: 13px; font-weight: 600; color: var(--hint); margin: 8px 0 10px; }
        .cat-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 10px;
            border-radius: 20px;
            background: var(--accent-dim);
            border: 1px solid var(--accent);
            color: var(--accent);
            font-size: 13px;
            margin: 0 6px 6px 0;
        }
        .cat-tag-remove { cursor: pointer; opacity: 0.7; font-size: 15px; }

        .footer {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
            background: var(--bg);
            border-top: 1px solid var(--border);
            z-index: 100;
        }

        .spinner-inline {
            display: inline-block;
            width: 16px; height: 16px;
            border: 2px solid rgba(0,0,0,0.3);
            border-top-color: #000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .empty-state {
            text-align: center;
            padding: 30px 16px;
            color: var(--hint);
            font-size: 14px;
        }
        .empty-state span { font-size: 32px; display: block; margin-bottom: 8px; }

        .existing-section-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--hint);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin: 4px 0 10px;
        }

        .existing-item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-bottom: 8px;
        }
        .existing-item-name {
            font-size: 14px;
            color: var(--text);
        }
        .existing-item-meta {
            font-size: 12px;
            color: var(--hint);
            margin-left: 8px;
        }
        .btn-delete-existing {
            background: none;
            border: none;
            color: var(--danger);
            font-size: 20px;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 8px;
            line-height: 1;
            opacity: 0.7;
            min-width: 44px;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-delete-existing:hover { opacity: 1; background: rgba(239,68,68,0.1); }

        .existing-cat-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 10px;
            border-radius: 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--hint);
            font-size: 13px;
            margin: 0 6px 6px 0;
        }
        .existing-cat-remove {
            cursor: pointer;
            font-size: 15px;
            opacity: 0.6;
            color: var(--danger);
        }
        .existing-cat-remove:hover { opacity: 1; }
    </style>
</head>
<body>
    <div class="header">
        <h1>&#x1F437; Gestisci il tuo spazio</h1>
        <p>Aggiungi, modifica o rimuovi conti, categorie e abbonamenti in qualsiasi momento.</p>
    </div>

    <div class="tabs">
        <button class="tab-btn" id="tab-accounts">&#x1F3E6; Conti</button>
        <button class="tab-btn active" id="tab-categories">&#x1F4C2; Categorie</button>
        <button class="tab-btn" id="tab-subscriptions">&#x1F501; Abbonamenti</button>
    </div>

    <div id="panel-accounts" class="panel">
        <div id="existing-accounts-section"></div>
        <div id="accounts-cards"></div>
        <button class="btn-add" id="add-account-btn">&#xFF0B; Aggiungi Conto</button>
    </div>

    <div id="panel-categories" class="panel active">
        <div id="existing-categories-section"></div>

        <p class="cat-section-title">Cerca e seleziona dalle categorie comuni</p>
        <input type="text" class="cat-search" id="cat-search-input" placeholder="&#x1F50D; Cerca categoria...">
        <div class="preset-grid" id="preset-grid"></div>

        <p class="cat-section-title">Oppure aggiungila manualmente</p>
        <div class="cat-add-manual">
            <input type="text" id="manual-cat-input" placeholder="Nome categoria personalizzata...">
            <button class="cat-manual-btn" id="manual-cat-btn">&#xFF0B;</button>
        </div>

        <div id="cat-tags-wrapper" style="display:none">
            <p class="added-categories-title">&#x2705; Categorie da aggiungere:</p>
            <div id="cat-tags"></div>
            <button id="save-categories-btn" style="width:100%; margin-top:10px; padding:12px; background:var(--accent); color:#000; border:none; border-radius:10px; font-weight:700; font-size:14px; cursor:pointer;">&#x2713; Salva categorie</button>
        </div>
    </div>

    <div id="panel-subscriptions" class="panel">
        <div id="existing-subscriptions-section"></div>
        <div id="subscriptions-cards"></div>
        <button class="btn-add" id="add-subscription-btn">&#xFF0B; Aggiungi Abbonamento</button>
    </div>

    <div class="footer" style="text-align:center; padding: 10px 16px;">
        <span style="font-size:12px; color: var(--hint);">Le modifiche vengono salvate subito ad ogni operazione</span>
    </div>


    <script>
        // Safe Telegram WebApp init
        var tg = null;
        try {
            if (window.Telegram && window.Telegram.WebApp) {
                tg = window.Telegram.WebApp;
                tg.expand();
            }
        } catch(e) { /* noop */ }

        var schemasRaw = {{ schemas | tojson }};
        var REG_TOKEN = "{{ reg_token }}";
        var BACKEND = "{{ backend|default('notion') }}";
        var availableAccounts = {{ available_accounts | tojson }};
        var availableCategories = {{ available_categories | tojson }};
        var availableSubscriptions = {{ available_subscriptions | tojson }};
        var IS_FIRST_SETUP = {{ 'true' if is_first_setup else 'false' }};

        // Schema di default: usato quando Notion non espone le proprietà
        // (es. linked database views non condivise con l'integrazione)
        // oppure quando siamo in backend postgres (niente schema Notion a disposizione).
        var SCHEMA_DEFAULTS;
        if (BACKEND === 'postgres') {
            // Schema semplificato: solo i campi che la tabella postgres richiede davvero.
            SCHEMA_DEFAULTS = {
                accounts_db_id: {
                    properties: {
                        'Name': { type: 'title' },
                        'Saldo iniziale': { type: 'number' },
                        'Account Type': { type: 'select', options: ['Cash','Brokerage','Credit Card','Saving'] }
                    }
                },
                subscriptions_db_id: {
                    properties: {
                        'Name': { type: 'title' },
                        'Amount': { type: 'number' },
                        'Last Billed': { type: 'date' },
                        'Type': { type: 'select', options: ['Mensile','Annuale','Settimanale','Trimestrale','Bi-mensile'] },
                        'Account': { type: 'relation' },
                        'Category': { type: 'relation' }
                    }
                }
            };
        } else {
            SCHEMA_DEFAULTS = {
                accounts_db_id: {
                    properties: {
                        'Name': { type: 'title' },
                        '{{ col_accounts_initial_amount }}': { type: 'number' },
                        '{{ col_accounts_type }}': { type: 'select', options: [
                            'Cash','Brokerage','Credit Card','Saving'
                        ]}
                    }
                },
                subscriptions_db_id: {
                    properties: {
                        'Name': { type: 'title' },
                        '{{ col_sub_type }}': { type: 'select', options: [
                            'Mensile','Annuale','Settimanale','Trimestrale','Bi-mensile'
                        ]},
                        '{{ col_sub_amount }}': { type: 'number' },
                        '{{ col_sub_last_billed }}': { type: 'date' },
                        '{{ col_sub_category }}': { type: 'relation' },
                        '{{ col_sub_account }}': { type: 'relation' }
                    }
                }
            };
        }

        var itemsData = { accounts_db_id: [], subscriptions_db_id: [] };
        var selectedCategories = [];

        // Copie mutabili degli item già presenti (da bootstrap)
        var existingAccounts = availableAccounts.slice();
        var existingCategories = availableCategories.slice();
        var existingSubscriptions = (typeof availableSubscriptions !== 'undefined' ? availableSubscriptions : []).slice();

        // ---- CRUD helpers ----

        function apiCall(method, path, body, onSuccess, onError) {
            fetch(path, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            })
            .then(function(resp) { return resp.json().then(function(res) { return { ok: resp.ok, res: res }; }); })
            .then(function(data) {
                if (data.ok && data.res.status === 'ok') {
                    onSuccess(data.res);
                } else {
                    var msg = (data.res && data.res.error) ? data.res.error : 'Errore sconosciuto';
                    if (onError) onError(msg); else showMsg('Errore: ' + msg);
                }
            })
            .catch(function(err) {
                if (onError) onError(err.message); else showMsg('Errore: ' + err.message);
            });
        }

        function confirmAction(msg, cb) {
            if (tg && tg.showConfirm) {
                tg.showConfirm(msg, function(ok) { if (ok) cb(); });
            } else {
                if (window.confirm(msg)) cb();
            }
        }

        function deleteItem(entityId, entityType, onSuccess) {
            apiCall('DELETE', '/api/manage/remove',
                { reg_token: REG_TOKEN, entity_type: entityType, entity_id: entityId },
                onSuccess,
                function(msg) { showMsg('Errore eliminazione: ' + msg); }
            );
        }

        function addItem_api(entityType, data, onSuccess, onError) {
            apiCall('POST', '/api/manage/add',
                { reg_token: REG_TOKEN, entity_type: entityType, data: data },
                onSuccess, onError
            );
        }

        function updateItem_api(entityType, entityId, data, onSuccess, onError) {
            apiCall('PUT', '/api/manage/update',
                { reg_token: REG_TOKEN, entity_type: entityType, entity_id: entityId, data: data },
                onSuccess, onError
            );
        }

        // Legacy — mantenuto per compat ma non più usato
        function deleteNotionItem(pageId, type, onSuccess) {
            deleteItem(pageId, type, onSuccess);
        }

        // ---- RENDER EXISTING (con edit inline + delete) ----

        function makeEditForm(entityType, item, onSaved, onCancel) {
            var form = document.createElement('div');
            form.style.cssText = 'padding:12px 0;';
            if (entityType === 'account') {
                var typeOpts = ['Cash','Brokerage','Credit Card','Saving'];
                var typeSelHtml = typeOpts.map(function(t) {
                    var sel = (item.account_type === t) ? ' selected' : '';
                    return '<option value="' + t + '"' + sel + '>' + t + '</option>';
                }).join('');
                var balanceHtml = '';
                if (IS_FIRST_SETUP) {
                    balanceHtml = '<div class="field"><label>Saldo iniziale (€)</label>'
                        + '<input type="number" step="0.01" class="edit-balance" value="' + (item.balance != null ? item.balance : '0') + '"></div>';
                }
                form.innerHTML = '<div class="field"><label>Nome</label>'
                    + '<input type="text" class="edit-name" value="' + escapeHtml(item.name) + '"></div>'
                    + balanceHtml
                    + '<div class="field"><label>Tipo conto</label>'
                    + '<select class="edit-account-type"><option value="">-- Seleziona --</option>' + typeSelHtml + '</select></div>';
            } else if (entityType === 'subscription') {
                var subTypeOpts = ['Mensile','Annuale','Settimanale','Trimestrale','Bi-mensile'];
                var subTypeSelHtml = subTypeOpts.map(function(t) {
                    var sel = (item.sub_type === t) ? ' selected' : '';
                    return '<option value="' + t + '"' + sel + '>' + t + '</option>';
                }).join('');
                form.innerHTML = '<div class="field"><label>Nome</label>'
                    + '<input type="text" class="edit-name" value="' + escapeHtml(item.name) + '"></div>'
                    + '<div class="field"><label>Importo (€)</label>'
                    + '<input type="number" step="0.01" class="edit-amount" value="' + (item.amount != null ? item.amount : '') + '"></div>'
                    + '<div class="field"><label>Frequenza</label>'
                    + '<select class="edit-sub-type"><option value="">-- Seleziona --</option>' + subTypeSelHtml + '</select></div>'
                    + '<div class="field"><label>Conto</label>'
                    + '<select data-relation-for="Account"><option value="">-- Seleziona --</option></select></div>'
                    + '<div class="field"><label>Categoria</label>'
                    + '<select data-relation-for="Category"><option value="">-- Seleziona --</option></select></div>';
            } else if (entityType === 'category') {
                form.innerHTML = '<div class="field"><label>Nome Categoria</label>'
                    + '<input type="text" class="edit-name" value="' + escapeHtml(item.name) + '"></div>'
                    + '<div class="field"><label>Budget mensile (€)</label>'
                    + '<input type="number" step="0.01" class="edit-budget" placeholder="es. 200" value="' + (item.monthly_budget != null ? item.monthly_budget : '') + '"></div>';
            }
            var btnRow = document.createElement('div');
            btnRow.style.cssText = 'display:flex; gap:8px; margin-top:8px;';
            var saveBtn = document.createElement('button');
            saveBtn.textContent = '✓ Salva';
            saveBtn.style.cssText = 'flex:1; padding:10px; background:var(--accent); color:#000; border:none; border-radius:10px; font-weight:700; cursor:pointer;';
            var cancelBtn = document.createElement('button');
            cancelBtn.textContent = 'Annulla';
            cancelBtn.style.cssText = 'flex:1; padding:10px; background:var(--surface); color:var(--text); border:1px solid var(--border); border-radius:10px; cursor:pointer;';
            saveBtn.addEventListener('click', function() {
                var data = {};
                if (entityType === 'account') {
                    data.name = form.querySelector('.edit-name').value.trim();
                    data.account_type = form.querySelector('.edit-account-type').value || null;
                    if (IS_FIRST_SETUP) {
                        var balVal = form.querySelector('.edit-balance').value;
                        if (balVal !== '') data.balance = parseFloat(balVal);
                    }
                } else if (entityType === 'subscription') {
                    data.name = form.querySelector('.edit-name').value.trim();
                    var amtVal = form.querySelector('.edit-amount').value;
                    if (amtVal !== '') data.amount = parseFloat(amtVal);
                    data.sub_type = form.querySelector('.edit-sub-type').value || null;
                    data.account_id = form.querySelector('[data-relation-for="Account"]').value || null;
                    data.category_id = form.querySelector('[data-relation-for="Category"]').value || null;
                } else if (entityType === 'category') {
                    data.name = form.querySelector('.edit-name').value.trim();
                    var budgetVal = form.querySelector('.edit-budget').value;
                    if (budgetVal !== '') data.monthly_budget = parseFloat(budgetVal);
                }
                saveBtn.disabled = true;
                saveBtn.textContent = '...';
                updateItem_api(entityType, item.id, data, function(res) {
                    onSaved(res.entity || data);
                }, function(msg) {
                    saveBtn.disabled = false;
                    saveBtn.textContent = '✓ Salva';
                    showMsg('Errore: ' + msg);
                });
            });
            cancelBtn.addEventListener('click', onCancel);
            btnRow.appendChild(saveBtn);
            btnRow.appendChild(cancelBtn);
            form.appendChild(btnRow);
            return form;
        }

        function renderExistingAccounts() {
            var section = document.getElementById('existing-accounts-section');
            if (!section) return;
            if (existingAccounts.length === 0) { section.innerHTML = ''; return; }
            section.innerHTML = '<p class="existing-section-title">&#x1F3E6; Conti gi\u00e0 presenti</p>';
            existingAccounts.forEach(function(a, idx) {
                var row = document.createElement('div');
                row.className = 'existing-item-row';
                row.style.flexDirection = 'column';
                row.style.alignItems = 'stretch';

                var topRow = document.createElement('div');
                topRow.style.cssText = 'display:flex; justify-content:space-between; align-items:center;';
                var meta = (a.balance !== undefined && a.balance !== null)
                    ? ' \u2014 ' + a.balance + (a.currency ? ' ' + a.currency : '') : '';
                topRow.innerHTML = '<span class="existing-item-name">' + escapeHtml(a.name)
                    + '<span class="existing-item-meta">' + escapeHtml(meta) + '</span></span>';

                var btnGroup = document.createElement('div');
                btnGroup.style.cssText = 'display:flex; gap:6px;';
                var editBtn = document.createElement('button');
                editBtn.textContent = '✏️';
                editBtn.style.cssText = 'background:none; border:none; cursor:pointer; font-size:16px; padding:2px 4px; opacity:0.7;';
                var delBtn = document.createElement('button');
                delBtn.className = 'btn-delete-existing';
                delBtn.textContent = '×';
                delBtn.title = 'Elimina';

                btnGroup.appendChild(editBtn);
                btnGroup.appendChild(delBtn);
                topRow.appendChild(btnGroup);
                row.appendChild(topRow);

                var editFormContainer = document.createElement('div');
                editFormContainer.style.display = 'none';
                row.appendChild(editFormContainer);
                section.appendChild(row);

                editBtn.addEventListener('click', function() {
                    if (editFormContainer.style.display === 'none') {
                        editFormContainer.style.display = 'block';
                        editFormContainer.innerHTML = '';
                        editFormContainer.appendChild(makeEditForm('account', a,
                            function(updated) {
                                existingAccounts[idx] = Object.assign(a, updated);
                                renderExistingAccounts();
                                refreshRelationOptions();
                            },
                            function() { editFormContainer.style.display = 'none'; }
                        ));
                    } else {
                        editFormContainer.style.display = 'none';
                    }
                });

                delBtn.addEventListener('click', function() {
                    confirmAction('Eliminare il conto "' + a.name + '"?', function() {
                        deleteItem(a.id, 'account', function() {
                            existingAccounts.splice(idx, 1);
                            renderExistingAccounts();
                            refreshRelationOptions();

        function saveSelectedCategories() {

            var toSave = selectedCategories.slice();
            var btn = document.getElementById('save-categories-btn');
            btn.disabled = true;
            btn.textContent = '...';
            var errors = [];
            function saveNext(i) {
                if (i >= toSave.length) {
                    btn.disabled = false;
                    btn.innerHTML = '&#x2713; Salva categorie';
                    if (errors.length > 0) showMsg('Errori: ' + errors.join(', '));
                    return;
                }
                var cat = toSave[i];
                var budget = categoryBudgets[cat] || null;
                addItem_api('category', { name: cat, monthly_budget: budget }, function(res) {
                    existingCategories.push(res.entity || { id: null, name: cat, monthly_budget: budget });
                    delete categoryBudgets[cat];
                    selectedCategories = selectedCategories.filter(function(c) { return c !== cat; });
                    renderCatTags();
                    renderPresets();
                    renderExistingCategories();
                    refreshRelationOptions();
                    saveNext(i + 1);

                    errors.push(cat + ': ' + msg);
                    saveNext(i + 1);

        function getSchema(dbKey) {
            var s = schemasRaw[dbKey];
            var liveProps = (s && s.properties && Object.keys(s.properties).length > 0)
                            ? s.properties : null;
            if (liveProps) return liveProps;
            // Fallback agli schemi hardcoded quando Notion non espone le proprietà
            var def = SCHEMA_DEFAULTS[dbKey];
            return (def && def.properties) ? def.properties : {};
        }

        var LABEL_IT = {
            'Last Billed':   'Data inizio abbonamento',
            'Amount':        'Importo (€)',

            'Account':       'Conto',

        var categoryBudgets = {};

        function fieldLabel(name) {

        function buildFields(dbKey, idx, container) {
            var props = getSchema(dbKey);
            var excluded = ['formula','rollup','created_time','last_edited_time','created_by','last_edited_by','button'];

            if (Object.keys(props).length === 0) {
                var fallbackDiv = document.createElement('div');
                fallbackDiv.className = 'field';
                var lbl = document.createElement('label');
                lbl.textContent = 'Nome';
                var inp = document.createElement('input');
                inp.type = 'text';
                inp.placeholder = 'Inserisci nome...';
                inp.addEventListener('input', function() {
                    if (!itemsData[dbKey][idx]) itemsData[dbKey][idx] = {};
                    itemsData[dbKey][idx]['Name'] = this.value;
                });
                fallbackDiv.appendChild(lbl);
                fallbackDiv.appendChild(inp);
                container.appendChild(fallbackDiv);
                return;
            }

            var propNames = Object.keys(props);
            for (var pi = 0; pi < propNames.length; pi++) {
                var pName = propNames[pi];
                var pInfo = props[pName];
                if (excluded.indexOf(pInfo.type) !== -1) continue;

                var fieldDiv = document.createElement('div');
                fieldDiv.className = 'field';
                var lbl = document.createElement('label');
                var lblText = fieldLabel(pName);
                
                if (lblText === 'Saldo iniziale') {
                    lbl.innerHTML = 'Saldo iniziale (€) <span class="info-icon" style="cursor:help; background:var(--border); border-radius:50%; padding:0 5px; font-size:12px; margin-left:4px;" onclick="alert(&quot;Questa è la quantità di denaro attualmente posseduta al momento della registrazione per questo conto.\\n\\nEsempi:\\n- Cash (Contanti): i soldi fisici nel tuo portafoglio.\\n- Conto Corrente: il saldo attuale presso la tua banca.\\n- Prepagata: i fondi caricati sulla tua carta ricaricabile.&quot;)">(i)</span>';
                } else {
                    lbl.textContent = lblText;
                }
                
                fieldDiv.appendChild(lbl);

                var el;
                if (pInfo.type === 'select' || pInfo.type === 'multi_select') {
                    el = document.createElement('select');
                    var defOpt = document.createElement('option');
                    defOpt.value = ''; defOpt.textContent = 'Seleziona...';
                    el.appendChild(defOpt);
                    // pInfo.options → schema processato da discover_db_schemas (array di stringhe)
                    // pInfo[pInfo.type].options → schema Notion raw (array di oggetti {id, name, color})
                    // Controlliamo length > 0 perché [] è truthy e non triggera il fallback
                    var rawOpts = (Array.isArray(pInfo.options) && pInfo.options.length > 0)
                        ? pInfo.options
                        : ((pInfo[pInfo.type] && Array.isArray(pInfo[pInfo.type].options) && pInfo[pInfo.type].options.length > 0)
                            ? pInfo[pInfo.type].options : []);
                    var opts = rawOpts.map(function(o) { return typeof o === 'string' ? o : o.name; });
                    for (var oi = 0; oi < opts.length; oi++) {
                        var opt = document.createElement('option');
                        opt.value = opts[oi]; opt.textContent = opts[oi];
                        el.appendChild(opt);
                    }
                } else if (pInfo.type === 'number') {
                    el = document.createElement('input');
                    el.type = 'number'; el.step = 'any'; el.placeholder = '0.00';
                } else if (pInfo.type === 'date') {
                    el = document.createElement('input');
                    el.type = 'date';
                } else if (pInfo.type === 'checkbox') {
                    el = document.createElement('select');
                    var no = document.createElement('option'); no.value = 'false'; no.textContent = 'No';
                    var si = document.createElement('option'); si.value = 'true'; si.textContent = 'Si';
                    el.appendChild(no); el.appendChild(si);
                } else if (pInfo.type === 'relation') {
                    el = document.createElement('select');
                    el.setAttribute('data-relation-for', pName);
                    el.innerHTML = '<option value="">-- Seleziona --</option>';
                    // Le opzioni vengono popolate da refreshRelationOptions()
                } else {
                    el = document.createElement('input');
                    el.type = 'text'; el.placeholder = '...';
                }

                (function(key, i, name, type) {
                    var handler = function() {
                        if (!itemsData[key][i]) itemsData[key][i] = {};
                        var v = this.value;
                        if (type === 'checkbox') v = (v === 'true');
                        if (type === 'number') v = parseFloat(v);
                        itemsData[key][i][name] = v;
                    };
                    el.addEventListener('input', handler);
                    el.addEventListener('change', handler);
                })(dbKey, idx, pName, pInfo.type);

                fieldDiv.appendChild(el);
                container.appendChild(fieldDiv);
            }
        }

        function renderCards(dbKey) {
            var containerId = dbKey === 'accounts_db_id' ? 'accounts-cards' : 'subscriptions-cards';
            var container = document.getElementById(containerId);
            if (!container) return;
            container.innerHTML = '';

            var labels = { accounts_db_id: 'Conto', subscriptions_db_id: 'Abbonamento' };
            var entityType = dbKey === 'accounts_db_id' ? 'account' : 'subscription';

            for (var i = 0; i < itemsData[dbKey].length; i++) {
                (function(idx) {
                    var card = document.createElement('div');
                    card.className = 'card';

                    var hdr = document.createElement('div');
                    hdr.className = 'card-header';
                    var ttl = document.createElement('span');
                    ttl.className = 'card-title';
                    ttl.textContent = (labels[dbKey] || 'Elemento') + ' #' + (idx + 1);
                    var rmBtn = document.createElement('button');
                    rmBtn.className = 'btn-remove';
                    rmBtn.textContent = '\u2715';
                    rmBtn.title = 'Annulla';
                    rmBtn.addEventListener('click', function() { removeItem(dbKey, idx); });
                    hdr.appendChild(ttl);
                    hdr.appendChild(rmBtn);
                    card.appendChild(hdr);

                    buildFields(dbKey, idx, card);

                    // Pulsante "Salva questo" — chiama POST /api/manage/add
                    var saveBtn = document.createElement('button');
                    saveBtn.innerHTML = '&#x2713; Salva questo';
                    saveBtn.style.cssText = 'width:100%; margin-top:12px; padding:12px; background:var(--accent); color:#000; border:none; border-radius:10px; font-weight:700; font-size:14px; cursor:pointer;';
                    saveBtn.addEventListener('click', function() {
                        var item = itemsData[dbKey][idx] || {};
                        var name = (item['Name'] || '').trim();
                        if (!name) { showMsg('Inserisci un nome.'); return; }
                        var data = { name: name };
                        if (entityType === 'account') {
                            data.initial_balance = parseFloat(item['Saldo iniziale'] || item['Initial Amount'] || 0) || 0;
                            if (item['Account Type'] || item['' + '{{ col_accounts_type }}']) {
                                data.account_type = item['Account Type'] || item['{{ col_accounts_type }}'];
                            }
                        } else if (entityType === 'subscription') {
                            data.last_billed = item['{{ col_sub_last_billed }}'] || item['Last Billed'] || null;
                            data.sub_type = item['Type'] || item['{{ col_sub_type }}'] || null;
                            data.amount = item['Importo mensile'] || item['Amount'] || item['{{ col_sub_amount }}'] || null;
                            var catVal = item['{{ col_sub_category }}'] || item['Category'] || null;
                            var accVal = item['{{ col_sub_account }}'] || item['Account'] || null;
                            // Solo page_id UUID (non __name__:... che sono entità da creare)
                            if (catVal && String(catVal).indexOf('__name__:') !== 0) data.category_id = catVal;
                            if (accVal && String(accVal).indexOf('__name__:') !== 0) data.account_id = accVal;
                        }
                        saveBtn.disabled = true;
                        saveBtn.textContent = '...';
                        addItem_api(entityType, data, function(res) {
                            // Rimuovi la card e aggiorna la lista esistenti
                            removeItem(dbKey, idx);
                            if (entityType === 'account') {
                                existingAccounts.push(res.entity || { id: res.entity && res.entity.id, name: name });
                                renderExistingAccounts();
                                refreshRelationOptions();
                            } else if (entityType === 'subscription') {
                                if (!existingSubscriptions) existingSubscriptions = [];
                                existingSubscriptions.push(res.entity || { id: null, name: name });
                                renderExistingSubscriptions();
                            }
                        }, function(msg) {
                            saveBtn.disabled = false;
                            saveBtn.innerHTML = '&#x2713; Salva questo';
                            showMsg('Errore: ' + msg);
                        });
                    });
                    card.appendChild(saveBtn);
                    container.appendChild(card);
                })(i);
            }
        }

        // Aggiorna i dropdown relation in tutte le card subscriptions
        function refreshRelationOptions() {
            // Costruisce la mappa dei nomi proprietà che rappresentano relazioni "account"
            // usando il mapping dello schema Notion (più affidabile del solo string-match).
            var accountRelKeys = {};
            var subMapped = (schemasRaw['subscriptions_db_id'] && schemasRaw['subscriptions_db_id'].mapped) || {};
            ['rel_account', 'rel_account_from', 'rel_account_to'].forEach(function(k) {
                if (subMapped[k]) accountRelKeys[subMapped[k].toLowerCase()] = true;
            });

            function isAccountRelation(relFor) {
                var lower = relFor.toLowerCase();
                // Nomi hardcoded in makeEditForm (sempre inglese)
                if (lower === 'account') return true;
                if (lower === 'category') return false;
                // Schema mapping (funziona con nomi italiani es. "Conto")
                if (Object.keys(accountRelKeys).length > 0) return accountRelKeys[lower] === true;
                // Fallback keyword: inglese + italiano
                return lower.indexOf('account') !== -1 || lower === 'conto';
            }

            // Opzioni Account: esistenti su Notion (mutable) + quelli che si stanno aggiungendo nel form
            var accOpts = existingAccounts.map(function(a) { return { value: a.id, label: a.name }; });
            itemsData['accounts_db_id'].forEach(function(item) {
                var n = item['Name'] || '';
                if (n && !accOpts.find(function(o) { return o.label === n; }))
                    accOpts.push({ value: '__name__:' + n, label: n + ' (da creare)' });
            });

            // Opzioni Category: esistenti su Notion (mutable) + quelle selezionate nel form
            var catOpts = existingCategories.map(function(c) { return { value: c.id, label: c.name }; });
            selectedCategories.forEach(function(n) {
                if (!catOpts.find(function(o) { return o.label === n; }))
                    catOpts.push({ value: '__name__:' + n, label: n + ' (da creare)' });
            });

            // Aggiorna tutti i <select> marcati con data-relation-for
            document.querySelectorAll('[data-relation-for]').forEach(function(sel) {
                var relFor = sel.getAttribute('data-relation-for');
                var opts = isAccountRelation(relFor) ? accOpts : catOpts;
                var cur = sel.value;
                sel.innerHTML = '<option value="">-- Seleziona --</option>';
                opts.forEach(function(o) {
                    var opt = document.createElement('option');
                    opt.value = o.value; opt.textContent = o.label;
                    if (o.value === cur) opt.selected = true;
                    sel.appendChild(opt);
                });
            });
        }

        function showMsg(msg) {

        document.addEventListener('DOMContentLoaded', function() {
            // Tab switching
            var tabAccounts = document.getElementById('tab-accounts');
            var tabSubscriptions = document.getElementById('tab-subscriptions');
            if (tabAccounts) tabAccounts.addEventListener('click', function() { switchTab('accounts'); });
            document.getElementById('tab-categories').addEventListener('click', function() { switchTab('categories'); });
            if (tabSubscriptions) tabSubscriptions.addEventListener('click', function() { switchTab('subscriptions'); });

            // Add item buttons
            var addAccountBtn = document.getElementById('add-account-btn');
            if (addAccountBtn) addAccountBtn.addEventListener('click', function() { addItem('accounts_db_id'); });
            document.getElementById('add-subscription-btn').addEventListener('click', function() { addItem('subscriptions_db_id'); });

            // Category search
            document.getElementById('cat-search-input').addEventListener('input', function() { filterPresets(this.value); });

            // Manual category
            document.getElementById('manual-cat-btn').addEventListener('click', addManualCategory);
            document.getElementById('save-categories-btn').addEventListener('click', saveSelectedCategories);
            document.getElementById('manual-cat-input').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') { e.preventDefault(); addManualCategory(); }
            });

            // Initial renders
            renderExistingAccounts();
            renderExistingCategories();
            renderExistingSubscriptions();
            renderPresets();
            renderCards('accounts_db_id');
            renderCards('subscriptions_db_id');
            refreshRelationOptions();
        });
    </script>
</body>
</html>
