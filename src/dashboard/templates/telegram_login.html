<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Expensum — Accedi</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            background: #F7F6F2;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .wrapper {
            width: 100%;
            max-width: 420px;
        }

        .brand {
            text-align: center;
            margin-bottom: 32px;
        }
        .brand-name {
            font-size: 22px;
            font-weight: 800;
            color: #1A3673;
            letter-spacing: -0.5px;
        }
        .brand-payoff {
            font-size: 12px;
            color: #B0B5B9;
            margin-top: 2px;
            letter-spacing: 0.02em;
        }
        .brand-accent {
            display: inline-block;
            width: 32px;
            height: 3px;
            background: #C5A059;
            border-radius: 2px;
            margin-top: 8px;
        }

        .card {
            background: #ffffff;
            border-radius: 16px;
            padding: 36px 32px;
            box-shadow: 0 2px 24px rgba(26, 54, 115, 0.07);
        }

        .card-title {
            font-size: 20px;
            font-weight: 700;
            color: #1A3673;
            margin-bottom: 4px;
        }
        .card-sub {
            font-size: 13px;
            color: #B0B5B9;
            margin-bottom: 28px;
        }

        .field { margin-bottom: 16px; }

        label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: #B0B5B9;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            background: #F7F6F2;
            border: 1.5px solid #E8E6E0;
            border-radius: 12px;
            color: #1A3673;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            font-weight: 500;
            outline: none;
            transition: border-color .2s, box-shadow .2s;
        }
        input::placeholder { color: #B0B5B9; font-weight: 400; }
        input:focus {
            border-color: #1A3673;
            box-shadow: 0 0 0 3px rgba(26, 54, 115, 0.08);
        }

        .error {
            background: rgba(220, 53, 69, 0.07);
            border: 1.5px solid rgba(220, 53, 69, 0.25);
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 13px;
            color: #c0392b;
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #1A3673;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.01em;
            transition: background .2s, transform .1s;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        button:hover { background: #142d62; }
        button:active { transform: scale(0.99); }
        button:disabled { opacity: 0.65; cursor: not-allowed; transform: none; }

        .spinner {
            display: none;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.4);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .7s linear infinite;
        }
        button.loading .spinner { display: block; }
        button.loading .btn-label { opacity: 0.7; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Stato success */
        .state-wrap {
            text-align: center;
            padding: 16px 0;
        }
        .state-icon {
            font-size: 52px;
            margin-bottom: 16px;
            line-height: 1;
        }
        .state-title {
            font-size: 20px;
            font-weight: 700;
            color: #1A3673;
            margin-bottom: 8px;
        }
        .state-sub {
            font-size: 13px;
            color: #B0B5B9;
        }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="brand">
        <div class="brand-name">Expensum</div>
        <div class="brand-payoff">Il tuo compagno del risparmio</div>
        <div class="brand-accent"></div>
    </div>

    <div class="card">
        {% if success %}
        <div class="state-wrap">
            <div class="state-icon">✅</div>
            <div class="state-title">Accesso effettuato</div>
            <div class="state-sub">Puoi chiudere questa finestra.</div>
        </div>
        <script>
            setTimeout(function() {
                if (window.Telegram && window.Telegram.WebApp) {
                    window.Telegram.WebApp.close();
                }
            }, 1200);
        </script>

        {% elif expired %}
        <div class="state-wrap">
            <div class="state-icon">⏳</div>
            <div class="state-title">Sessione scaduta</div>
            <div class="state-sub">Usa /login nel bot per generare un nuovo link.</div>
        </div>

        {% else %}
        <div class="card-title">Bentornato</div>
        <div class="card-sub">Accedi con email e password</div>

        {% if error %}<div class="error">{{ error }}</div>{% endif %}

        <form method="POST" action="/auth/telegram-login" onsubmit="handleSubmit(event)">
            <input type="hidden" name="state" value="{{ state }}">
            <div class="field">
                <label>Email</label>
                <!-- type="text" senza inputmode: fix definitivo per Telegram WebApp Android che nasconde @ con type=email o inputmode=email -->
                <input
                    type="text"
                    name="email"
                    placeholder="tua@email.com"
                    pattern="[^@\s]+@[^@\s]+\.[^@\s]+"
                    title="Inserisci un indirizzo email valido"
                    required
                    autocomplete="email"
                    autocapitalize="none"
                    autocorrect="off"
                    spellcheck="false"
                    enterkeyhint="next"
                >
            </div>
            <div class="field">
                <label>Password</label>
                <input
                    type="password"
                    name="password"
                    placeholder="••••••••"
                    required
                    autocomplete="current-password"
                    autocapitalize="none"
                    autocorrect="off"
                    spellcheck="false"
                    enterkeyhint="go"
                >
            </div>
            <button type="submit" id="submitBtn">
                <div class="spinner"></div>
                <span class="btn-label">Accedi →</span>
            </button>
        </form>
        {% endif %}
    </div>
</div>

<script>
    if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    }
    function handleSubmit(e) {
        var btn = document.getElementById('submitBtn');
        btn.classList.add('loading');
        btn.disabled = true;
    }
</script>
</body>
</html>
