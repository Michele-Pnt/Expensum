<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Expensum — Accedi</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            background: var(--tg-theme-bg-color, #f5f7fa);
            color: var(--tg-theme-text-color, #111);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex; align-items: center; justify-content: center; padding: 24px;
        }
        .card {
            background: var(--tg-theme-secondary-bg-color, #ffffff);
            border-radius: 20px; padding: 36px 28px; width: 100%; max-width: 400px;
        }
        .logo {
            text-align: center; margin-bottom: 20px;
            font-size: 1.5rem; font-weight: 800; letter-spacing: 1px; color: #008080;
        }
        h1 { text-align: center; font-size: 20px; font-weight: 700; margin-bottom: 4px; }
        .sub { text-align: center; font-size: 13px; color: #888; margin-bottom: 28px; }
        .field { margin-bottom: 16px; }
        label { display: block; font-size: 12px; font-weight: 600; color: #888; margin-bottom: 6px; letter-spacing: .04em; text-transform: uppercase; }
        input {
            width: 100%; padding: 13px 16px;
            background: var(--tg-theme-bg-color, #f5f7fa);
            border: 1px solid rgba(0,0,0,0.12); border-radius: 12px;
            color: var(--tg-theme-text-color, #111);
            font-size: 15px; outline: none; transition: border-color .2s;
        }
        input:focus { border-color: #008080; }
        .error {
            background: rgba(255,80,80,0.12); border: 1px solid rgba(255,80,80,0.3);
            border-radius: 10px; padding: 10px 14px; font-size: 13px; color: #e55; margin-bottom: 18px;
        }
        .success-wrap {
            text-align: center; padding: 20px 0;
        }
        .success-icon { font-size: 56px; margin-bottom: 16px; }
        .success-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
        .success-sub { font-size: 14px; color: #888; }
        .expired-wrap { text-align: center; padding: 20px 0; }
        .expired-icon { font-size: 56px; margin-bottom: 16px; }
        button {
            width: 100%; padding: 14px; background: #008080; color: #fff;
            border: none; border-radius: 12px; font-size: 15px; font-weight: 700;
            cursor: pointer; margin-top: 8px; transition: background .15s;
        }
        button:active { background: #006666; }
        .spinner { display: none; }
        button.loading .spinner { display: inline; }
        button.loading .label { display: none; }
    </style>
</head>
<body>
<div class="card">
    {% if success %}
    <div class="success-wrap">
        <div class="success-icon">✅</div>
        <div class="success-title">Accesso effettuato</div>
        <div class="success-sub">Puoi chiudere questa finestra.</div>
    </div>
    <script>
        setTimeout(function() {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.close();
            }
        }, 1200);
    </script>
    {% elif expired %}
    <div class="expired-wrap">
        <div class="expired-icon">⏳</div>
        <div class="success-title">Sessione scaduta</div>
        <div class="success-sub">Usa /login nel bot per generare un nuovo link.</div>
    </div>
    {% else %}
    <div class="logo">Expensum</div>
    <h1>Bentornato</h1>
    <p class="sub">Inserisci email e password per accedere</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="POST" action="/auth/telegram-login" onsubmit="handleSubmit(event)">
        <input type="hidden" name="state" value="{{ state }}">
        <div class="field">
            <label>Email</label>
            <input type="email" name="email" placeholder="tua@email.com" required autofocus autocomplete="email" inputmode="email" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next">
        </div>
        <div class="field">
            <label>Password</label>
            <input type="password" name="password" placeholder="••••••••" required autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go">
        </div>
        <button type="submit" id="submitBtn">
            <span class="label">Accedi →</span>
            <span class="spinner">⏳</span>
        </button>
    </form>
    {% endif %}
</div>
<script>
    if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    }
    function handleSubmit(e) {
        var btn = document.getElementById('submitBtn');
        btn.classList.add('loading');
        btn.disabled = true;
    }
</script>
</body>
</html>
