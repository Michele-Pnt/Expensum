<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Expensum: Registrati</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            background: #1C363D;
            font-family: 'Sora', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .wrapper {
            width: 100%;
            max-width: 420px;
        }

        /* Logo / brand mark */
        .brand {
            text-align: center;
            margin-bottom: 32px;
        }
        .brand-name {
            font-size: 24px;
            font-weight: 300;
            color: #E9F1EA;
            letter-spacing: 0.015em;
        }
        .brand-payoff {
            font-size: 12px;
            color: #B0B5B9;
            margin-top: 2px;
            letter-spacing: 0.02em;
        }
        .brand-accent {
            display: inline-block;
            width: 32px;
            height: 3px;
            background: #5FC4CB;
            border-radius: 2px;
            margin-top: 8px;
        }

        /* Card */
        .card {
            background: rgba(233, 241, 234, 0.04);
            border: 1px solid rgba(176, 181, 185, 0.25);
            border-radius: 16px;
            padding: 36px 32px;
        }

        .card-title {
            font-size: 20px;
            font-weight: 500;
            color: #E9F1EA;
            margin-bottom: 4px;
        }
        .card-sub {
            font-size: 13px;
            color: #B0B5B9;
            margin-bottom: 28px;
        }

        /* Form */
        .row {
            display: flex;
            gap: 12px;
        }
        .row .field { flex: 1; }

        .field { margin-bottom: 16px; }

        label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: #B0B5B9;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            background: #1C363D;
            border: 1.5px solid rgba(176, 181, 185, 0.25);
            border-radius: 12px;
            color: #E9F1EA;
            font-family: 'Sora', sans-serif;
            font-size: 16px;
            font-weight: 400;
            outline: none;
            transition: border-color .2s, box-shadow .2s;
        }
        input::placeholder { color: #B0B5B9; font-weight: 400; }
        input:focus {
            border-color: #5FC4CB;
            box-shadow: 0 0 0 3px rgba(95, 196, 203, 0.15);
        }
        button:focus-visible, input:focus-visible, .hint a:focus-visible {
            outline: 2px solid #5FC4CB;
            outline-offset: 2px;
        }

        .error {
            background: rgba(230, 103, 103, 0.10);
            border: 1.5px solid rgba(230, 103, 103, 0.35);
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 13px;
            color: #e66767;
            margin-bottom: 20px;
        }

        .divider {
            height: 1px;
            background: rgba(176, 181, 185, 0.25);
            margin: 20px 0;
        }

        button {
            width: 100%;
            min-height: 44px;
            padding: 14px;
            background: #5FC4CB;
            color: #1C363D;
            border: none;
            border-radius: 12px;
            font-family: 'Sora', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.01em;
            transition: background .2s, transform .1s;
        }
        button:hover { background: #4AA7AE; }
        button:active { transform: scale(0.99); }

        .hint {
            font-size: 12px;
            color: #B0B5B9;
            text-align: center;
            margin-top: 20px;
        }
        .hint a {
            color: #5FC4CB;
            font-weight: 600;
            text-decoration: none;
        }
        .hint a:hover { text-decoration: underline; }

        .consent {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 12px;
        }
        .consent input {
            width: auto;
            margin-top: 3px;
        }
        .consent label {
            text-transform: none;
            font-size: 13px;
            font-weight: 400;
            color: #B0B5B9;
            letter-spacing: normal;
            margin-bottom: 0;
        }
        .consent label a { color: #5FC4CB; }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="brand">
            <div class="brand-name">Expensum</div>
            <div class="brand-payoff">Il tuo compagno del risparmio</div>
            <div class="brand-accent"></div>
        </div>

        <div class="card">
            <div class="card-title">Crea il tuo account</div>
            <div class="card-sub">Inizia a prendere controllo delle tue finanze</div>

            {% if error %}<div class="error">{{ error }}</div>{% endif %}

            <form method="POST" action="/register">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                {% if referral_code %}<input type="hidden" name="ref" value="{{ referral_code }}">{% endif %}
                <div class="row">
                    <div class="field">
                        <label>Nome</label>
                        <input type="text" name="first_name" placeholder="Mario" required autofocus>
                    </div>
                    <div class="field">
                        <label>Cognome</label>
                        <input type="text" name="last_name" placeholder="Rossi" required>
                    </div>
                </div>
                <div class="field">
                    <label>Email</label>
                    <input type="email" name="email" placeholder="mario@email.com" required>
                </div>
                <div class="divider"></div>
                <div class="field">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="Minimo 8 caratteri" required>
                </div>
                <div class="field">
                    <label>Conferma password</label>
                    <input type="password" name="password_confirm" placeholder="Ripeti la password" required>
                </div>
                <div class="consent">
                    <input type="checkbox" id="privacy_accepted" name="privacy_accepted" required>
                    <label for="privacy_accepted">Ho letto e accetto la <a href="/privacy" target="_blank">Privacy Policy</a>.</label>
                </div>
                <div class="consent">
                    <input type="checkbox" id="tos_accepted" name="tos_accepted" required>
                    <label for="tos_accepted">Ho letto e accetto i <a href="/terms" target="_blank">Termini di Servizio</a>.</label>
                </div>
                <div class="consent">
                    <input type="checkbox" id="age_attested" name="age_attested" required>
                    <label for="age_attested">Dichiaro di avere almeno 18 anni.</label>
                </div>

                <button type="submit">Registrati →</button>
            </form>
            <p style="font-size:12px;color:#B0B5B9;margin-top:16px;text-align:center;">
                I messaggi vengono conservati per 90 giorni, poi cancellati automaticamente.
            </p>
        </div>

        <p class="hint">Hai già un account? <a href="/login">Accedi</a></p>
    </div>
</body>
</html>
