<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Moneo — Registrazione</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            background: #f5f7fa;
            color: #111;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex; align-items: center; justify-content: center;
            padding: 24px;
        }
        .card {
            background: #ffffff;
            border: 1px solid rgba(0,0,0,0.08);
            border-radius: 20px;
            padding: 36px 28px;
            width: 100%; max-width: 400px;
            box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.05);
        }
        .logo { font-size: 40px; text-align: center; margin-bottom: 8px; }
        h1 { text-align: center; font-size: 20px; font-weight: 700; margin-bottom: 4px; color: #111; }
        .sub { text-align: center; font-size: 13px; color: #666; margin-bottom: 28px; }
        .field { margin-bottom: 16px; }
        label { display: block; font-size: 12px; font-weight: 600; color: #666; margin-bottom: 6px; letter-spacing: .04em; text-transform: uppercase; }
        input {
            width: 100%; padding: 13px 16px;
            background: #f5f7fa;
            border: 1px solid #eaeaea;
            border-radius: 12px; color: #111;
            font-size: 15px; outline: none;
            transition: border-color .2s;
        }
        input:focus { border-color: #008080; }
        .error {
            background: rgba(255,80,80,0.12);
            border: 1px solid rgba(255,80,80,0.3);
            border-radius: 10px; padding: 10px 14px;
            font-size: 13px; color: #ff8080;
            margin-bottom: 18px;
        }
        button {
            width: 100%; padding: 14px;
            background: #008080; color: #fff;
            border: none; border-radius: 12px;
            font-size: 15px; font-weight: 700;
            cursor: pointer; margin-top: 8px;
        }
        button:hover { background: #006666; }
        .hint { font-size: 12px; color: #666; text-align: center; margin-top: 16px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <h2 style="font-size: 1.5rem; font-weight: 800; letter-spacing: 1px; color: #008080;">Expensum / Moneo</h2>
        </div>
        <h1>Crea il tuo account</h1>
        <p class="sub">Scegli email e password per accedere a Moneo</p>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/auth/postgres">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="reg_token" value="{{ reg_token }}">

            <div class="field">
                <label>Email</label>
                <input type="email" name="email" placeholder="tua@email.com" required autofocus>
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" name="password" placeholder="Minimo 8 caratteri" required>
            </div>
            <div class="field">
                <label>Conferma password</label>
                <input type="password" name="password2" placeholder="Ripeti la password" required>
            </div>

            <button type="submit">Registrati →</button>
        </form>
        <p class="hint">Hai già un account? Usa /login su Telegram.</p>
    </div>
</body>
</html>
