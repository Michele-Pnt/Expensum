<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nuova password — Expensum</title>
    <style>
        body { background: #1C363D; color: #E9F1EA; font-family: sans-serif; padding: 48px 20px; }
        main { max-width: 460px; margin: auto; text-align: center; }
        p { color: #B0B5B9; line-height: 1.6; }
        input, button { display: block; width: 100%; padding: 12px; border-radius: 8px; border: 0; margin-top: 12px; }
        button { background: #5FC4CB; color: #1C363D; font-weight: 700; }
        .error { color: #E66767; }
    </style>
</head>
<body>
    <main>
        <h1>Imposta una nuova password</h1>
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="token" value="{{ token }}">
            <input type="password" name="password" placeholder="Nuova password" required autofocus>
            <input type="password" name="password_confirm" placeholder="Ripeti la password" required>
            <button type="submit">Salva password</button>
        </form>
        <p><a href="{{ url_for('auth.web_login') }}">Torna al login</a></p>
    </main>
</body>
</html>
