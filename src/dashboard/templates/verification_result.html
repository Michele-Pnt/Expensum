<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verifica email — Expensum</title>
    <style>
        body { background: #1C363D; color: #E9F1EA; font-family: sans-serif; padding: 48px 20px; }
        main { max-width: 460px; margin: auto; text-align: center; }
        p { color: #B0B5B9; line-height: 1.6; }
        a { color: #5FC4CB; }
    </style>
</head>
<body>
    <main>
        <h1>{{ "Email verificata" if success else "Link non valido" }}</h1>
        <p>{{ message }}</p>
        <p><a href="{{ url_for('auth.web_login') }}">Vai al login</a></p>
    </main>
</body>
</html>
