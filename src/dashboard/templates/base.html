<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moneo Admin Dashboard</title>
    <!-- Assolutamente no framework CSS come richiesto. Staging Vanilla puro. -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <nav class="sidebar glass-panel">
            <div class="logo">
                <h2>🐷 Moneo<span>Admin</span></h2>
            </div>
            <ul class="nav-links">
                <li><a href="{{ url_for('index') }}" class="{% if request.endpoint == 'index' %}active{% endif %}">📊 Overview</a></li>
                <li><a href="{{ url_for('users_list') }}" class="{% if request.endpoint == 'users_list' %}active{% endif %}">👥 Utenti</a></li>
                <li><a href="{{ url_for('feedbacks_list') }}" class="{% if request.endpoint == 'feedbacks_list' %}active{% endif %}">📧 Feedback</a></li>
                <li><a href="{{ url_for('logs_viewer') }}" class="{% if request.endpoint == 'logs_viewer' %}active{% endif %}">💻 Log Terminal</a></li>
            </ul>
            <div class="nav-footer">
                <a href="{{ url_for('logout') }}" class="btn-logout">Esci</a>
            </div>
        </nav>

        <!-- Main Content Area -->
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
