<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Login - Moneo Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-wrapper">

    <div class="login-box glass-panel">
        <h2 style="margin-bottom: 5px; color:#fff">Finance Agents</h2>
        <p style="color:var(--accent-neon); margin-bottom: 2rem;">Accesso Amministratore</p>
        
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <ul style="color: var(--danger); list-style:none; margin-bottom: 1rem;">
            {% for message in messages %}
              <li>{{ message }}</li>
            {% endfor %}
            </ul>
          {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="password" name="password" placeholder="Inserisci Password Master" required>
            <button type="submit">ENTRA NEL SISTEMA</button>
        </form>
    </div>

</body>
</html>
