<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Password dimenticata — Expensum</title>
    <style>
        body { background: #1C363D; color: #E9F1EA; font-family: sans-serif; padding: 48px 20px; }
        main { max-width: 460px; margin: auto; text-align: center; }
        p { color: #B0B5B9; line-height: 1.6; }
        a { color: #5FC4CB; }
        input, button { padding: 12px; border-radius: 8px; border: 0; }
        input { width: 62%; }
        button { background: #5FC4CB; color: #1C363D; font-weight: 700; }
        form { margin-top: 28px; }
    </style>
</head>
<body>
    <main>
        <h1>Password dimenticata?</h1>
        {% if submitted %}
        <p>Se l'indirizzo è associato a un account, riceverai un link per reimpostare la password.</p>
        {% else %}
        <p>Inserisci l'email del tuo account. Ti invieremo un link sicuro.</p>
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="email" name="email" placeholder="tua@email.com" required autofocus>
            <button type="submit">Invia link</button>
        </form>
        {% endif %}
        <p><a href="{{ url_for('auth.web_login') }}">Torna al login</a></p>
    </main>
</body>
</html>
