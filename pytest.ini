[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Parametri passati di default quando lanci "pytest"
addopts = --strict-markers -v

# Configuriamo le variabili d'ambiente per il testing.
# Così evitiamo di sporcare i veri token o database.
env =
    TESTING=True
    TELEGRAM_BOT_TOKEN=
    NOTION_OAUTH_CLIENT_ID=test_client_id
    NOTION_OAUTH_CLIENT_SECRET=test_client_secret
    AWS_ACCESS_KEY_ID=test_aws_key
    AWS_SECRET_ACCESS_KEY=test_aws_secret
