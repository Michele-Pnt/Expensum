[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: test puri, nessun DB né import pesanti
    integration: test con SQLite in-memory
    e2e: test con Flask test client (import pesante, non gira di default)
    gemini_live: smoke test opzionali con chiamate Gemini reali, separati dalla suite standard
    pg: test contro il Postgres locale 1:1 (RLS, ruoli, psycopg3). Richiede ./scripts/dev_db.sh up

# Di default escludi e2e e pg (il tier pg richiede il container Postgres attivo).
# Per girare tutto:      pytest -m "unit or integration or e2e"
# Per girare solo unit:  pytest -m unit
# Per i test Postgres:   pytest -m pg   (prima: ./scripts/dev_db.sh up && migrate)
addopts = --strict-markers -m "not e2e and not gemini_live and not pg" --ignore=tests/test_discovery.py --ignore=tests/test_notion_client.py

[coverage:run]
omit =
    src/chart_generator.py
    src/telegram_client.py
    src/gemini_client.py
    src/notion_client.py
    src/dashboard/*
